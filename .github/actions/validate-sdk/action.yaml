name: 'Validate SDK'
description: 'Run build, typecheck, and tests for the SDK'

inputs:
  openrouter-api-key:
    description: 'OpenRouter API key for running tests'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: 'pnpm'

    - name: Install dependencies
      shell: bash
      run: pnpm install

    - name: Build SDK
      shell: bash
      run: pnpm run build

    - name: Install examples dependencies
      shell: bash
      working-directory: examples
      run: pnpm install

    # TODO: Re-enable when Speakeasy fixes generated code type errors
    # Disabled: examples have no tsconfig.json and inherit the root one,
    # which causes TS5011/TS4114 errors due to generated code.
    # - name: Typecheck examples root
    #   shell: bash
    #   working-directory: examples
    #   run: pnpm exec tsc

    - name: Install nextjs-example dependencies
      shell: bash
      working-directory: examples/nextjs-example
      run: pnpm install

    - name: Typecheck nextjs-example
      shell: bash
      working-directory: examples/nextjs-example
      run: pnpm exec tsc --noEmit

    - name: Run unit tests
      shell: bash
      env:
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
      run: pnpm exec vitest --run --exclude 'tests/e2e/**'

    - name: Run e2e tests
      shell: bash
      env:
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
      run: pnpm exec vitest --run tests/e2e/
