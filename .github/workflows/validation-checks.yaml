name: Validation Checks

on:
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate SDK
        uses: ./.github/actions/validate-sdk
        with:
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
