name: Docs navigation

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/sanitize-docs-emoji.sh"
      - "scripts/gen-docs-nav.sh"
      - ".github/workflows/docs-nav.yaml"

# Shared with speakeasy_run_on_pr.yaml: both push generated files to the PR
# head branch, so they must not run at the same time on the same PR.
concurrency:
  group: generated-files-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  gen-docs-nav:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sanitize generated docs emoji
        run: scripts/sanitize-docs-emoji.sh

      # jq is preinstalled on GitHub-hosted ubuntu runners.
      - name: Regenerate docs navigation
        run: scripts/gen-docs-nav.sh

      - name: Auto-commit generated docs files
        uses: int128/update-generated-files-action@v2
        with:
          commit-message: "Chore: sanitize generated docs emoji"
