name: Run Speakeasy on PR

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .speakeasy/in.openapi.yaml

# Shared with docs-nav.yaml: both push generated files to the PR head branch,
# so they must not run at the same time on the same PR.
concurrency:
  group: generated-files-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  run-speakeasy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'

      # Installs the GitHub release that .speakeasy/workflow.yaml pins as
      # speakeasyVersion and verifies its checksum, instead of piping an
      # unpinned install script from the upstream main branch into sh.
      - name: Install Speakeasy CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n "s/^speakeasyVersion: *//p" .speakeasy/workflow.yaml)"
          test -n "$VERSION"
          cd "$RUNNER_TEMP"
          gh release download "v$VERSION" --repo speakeasy-api/speakeasy --pattern speakeasy_linux_amd64.zip --pattern checksums.txt
          grep " speakeasy_linux_amd64.zip$" checksums.txt | sha256sum -c -
          unzip -q speakeasy_linux_amd64.zip speakeasy -d bin
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/speakeasy" --version

      - name: Run Speakeasy
        run: speakeasy run
        env:
          SPEAKEASY_API_KEY: ${{ secrets.SPEAKEASY_API_KEY }}

      - name: Regenerate docs navigation
        run: scripts/gen-docs-nav.sh

      - name: Validate SDK
        uses: ./.github/actions/validate-sdk
        with:
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Auto-commit generated SDK and API docs
        uses: int128/update-generated-files-action@1486b210d2f982ac40d27ef55660863b006722b0 # v2.115.0
        with:
          # Set a custom message to the new commit (optional)
          commit-message: 'Chore: auto-generate SDK and API documentation'
